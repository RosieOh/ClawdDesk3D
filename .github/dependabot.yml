version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "CHORE :"

  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "CHORE :"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CHORE :"
